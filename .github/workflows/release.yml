name: build-and-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validar e compilar (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar dependências
        run: dotnet restore .\PrintFreeTool.csproj

      - name: Compilar em modo release
        run: dotnet build .\PrintFreeTool.csproj -c Release --no-restore

      - name: Validar versão da tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $projeto = Get-Content -Raw PrintFreeTool.csproj
          $versao = [regex]::Match($projeto, '<Version>([^<]+)</Version>').Groups[1].Value
          if (-not $versao) {
            throw "A versão não foi encontrada no PrintFreeTool.csproj."
          }
          if ($env:GITHUB_REF_NAME -ne "v$versao") {
            throw "A tag $env:GITHUB_REF_NAME não corresponde ao projeto ($versao)."
          }

      - name: Publicar executável independente
        run: dotnet publish .\PrintFreeTool.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o .\dist

      - name: Preparar artefatos
        shell: pwsh
        run: |
          Move-Item dist/PrintFreeTool.exe dist/PrintFreeTool-windows-x64.exe -Force
          $hash = (Get-FileHash -Algorithm SHA256 dist/PrintFreeTool-windows-x64.exe).Hash.ToLowerInvariant()
          "$hash  PrintFreeTool-windows-x64.exe" | Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - name: Armazenar resultado do build
        uses: actions/upload-artifact@v4
        with:
          name: PrintFreeTool-windows-x64
          path: |
            dist/PrintFreeTool-windows-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publicar release da tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Baixar artefatos validados
        uses: actions/download-artifact@v4
        with:
          name: PrintFreeTool-windows-x64
          path: dist

      - name: Atestar procedência do executável
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/PrintFreeTool-windows-x64.exe

      - name: Criar release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/PrintFreeTool-windows-x64.exe
            dist/SHA256SUMS.txt
